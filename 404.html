<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — NIFES Study Hub</title>
<link rel="stylesheet" href="app/css/styles.css">
<style>
.notfound{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
.notfound h1{font-size:clamp(3rem,8vw,6rem);font-family:var(--font-display);line-height:1.1;margin-bottom:1rem;background:linear-gradient(135deg,var(--color-primary),var(--color-accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.notfound p{color:var(--color-text-muted);margin-bottom:2rem;max-width:40ch}
</style>
</head>
<body>
<div class="notfound">
  <h1>404</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a href="/app/" class="btn-primary">Go to Study Hub</a>
</div>
</body>
</html>
